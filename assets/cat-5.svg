<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="camadaBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241B08"/>
      <stop offset="60%" stop-color="#141006"/>
      <stop offset="100%" stop-color="#070603"/>
    </radialGradient>
    <linearGradient id="goldCamada" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C5C0D"/>
    </linearGradient>
    <radialGradient id="nestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="velvetCushion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1212"/>
      <stop offset="50%" stop-color="#240707"/>
      <stop offset="100%" stop-color="#150202"/>
    </linearGradient>
    <linearGradient id="kittenOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="kittenWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="kittenBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="kittenCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#camadaBg)"/>
  
  <!-- Celestial Golden Halo & Stars -->
  <circle cx="200" cy="210" r="170" fill="url(#nestGlow)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#goldCamada)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#goldCamada)" stroke-width="0.75" opacity="0.25"/>

  <!-- Golden Stars & Sparkles -->
  <g fill="url(#goldCamada)">
    <!-- Star 1 -->
    <path d="M 200 45 L 203 55 L 213 58 L 203 61 L 200 71 L 197 61 L 187 58 L 197 55 Z" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M 100 80 L 102 87 L 109 89 L 102 91 L 100 98 L 98 91 L 91 89 L 98 87 Z" opacity="0.7"/>
    <!-- Star 3 -->
    <path d="M 300 80 L 302 87 L 309 89 L 302 91 L 300 98 L 298 91 L 291 89 L 298 87 Z" opacity="0.7"/>
    <!-- Sparkles -->
    <circle cx="70" cy="150" r="2" opacity="0.5"/>
    <circle cx="330" cy="150" r="2" opacity="0.5"/>
    <circle cx="130" cy="60" r="1.5" opacity="0.4"/>
    <circle cx="270" cy="60" r="1.5" opacity="0.4"/>
  </g>

  <!-- Royal Velvet Cushion / Golden Bassinet -->
  <ellipse cx="200" cy="305" rx="165" ry="75" fill="url(#velvetCushion)" stroke="url(#goldCamada)" stroke-width="3"/>
  <ellipse cx="200" cy="305" rx="145" ry="60" fill="#200606" stroke="url(#goldCamada)" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

  <!-- Golden Embroidered Tassels & Trim -->
  <path d="M 50 310 Q 200 375 350 310" fill="none" stroke="url(#goldCamada)" stroke-width="2.5"/>
  <circle cx="75" cy="325" r="4" fill="url(#goldCamada)"/>
  <circle cx="135" cy="342" r="4" fill="url(#goldCamada)"/>
  <circle cx="200" cy="348" r="5" fill="url(#goldCamada)"/>
  <circle cx="265" cy="342" r="4" fill="url(#goldCamada)"/>
  <circle cx="325" cy="325" r="4" fill="url(#goldCamada)"/>

  <!-- Blanket / Silk Swaddle -->
  <path d="M 70 300 C 100 240, 300 240, 330 300 C 300 350, 100 350, 70 300 Z" fill="#0D2818" stroke="url(#goldCamada)" stroke-width="1.5"/>

  <!-- ================= 5 SLEEPING NEWBORN KITTENS ================= -->

  <!-- KITTEN 1 (Left - Sleeping Ginger Baby) -->
  <g id="baby-1">
    <ellipse cx="125" cy="270" rx="30" ry="24" fill="url(#kittenOrange)"/>
    <!-- Head -->
    <circle cx="110" cy="255" r="20" fill="url(#kittenOrange)"/>
    <!-- Ears -->
    <polygon points="98,245 92,232 105,240" fill="#EA580C"/>
    <polygon points="112,240 120,230 123,243" fill="#EA580C"/>
    <!-- Sleeping Closed Eye -->
    <path d="M 100 258 Q 105 263 110 258" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
    <!-- Tiny Pink Nose -->
    <polygon points="104,264 102,262 106,262" fill="#FDA4AF"/>
    <!-- Royal Tiny Crown on baby -->
    <path d="M 103 234 L 106 226 L 110 231 L 114 226 L 117 234 Z" fill="url(#goldCamada)"/>
  </g>

  <!-- KITTEN 2 (Left Center - Pure White Sleeping Angel) -->
  <g id="baby-2">
    <ellipse cx="165" cy="275" rx="28" ry="22" fill="url(#kittenWhite)"/>
    <!-- Head -->
    <circle cx="150" cy="250" r="19" fill="url(#kittenWhite)"/>
    <!-- Ears -->
    <polygon points="140,240 135,228 147,235" fill="#FDA4AF"/>
    <polygon points="152,235 158,225 162,238" fill="#FDA4AF"/>
    <!-- Sleeping eye -->
    <path d="M 143 253 Q 148 257 153 253" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <polygon points="147,258 145,256 149,256" fill="#FDA4AF"/>
  </g>

  <!-- KITTEN 3 (Center - Calico/Cream Little Prince) -->
  <g id="baby-3">
    <ellipse cx="200" cy="262" rx="32" ry="25" fill="url(#kittenCream)"/>
    <!-- Head -->
    <circle cx="200" cy="238" r="21" fill="url(#kittenCream)"/>
    <!-- Ears -->
    <polygon points="187,228 182,214 195,222" fill="#A16207"/>
    <polygon points="205,222 218,214 213,228" fill="#A16207"/>
    <!-- Cute Spot on Forehead -->
    <ellipse cx="195" cy="233" rx="5" ry="7" fill="#78350F" opacity="0.7"/>
    <!-- Sleeping Eyes -->
    <path d="M 191 242 Q 195 246 199 242" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    <path d="M 201 242 Q 205 246 209 242" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    <polygon points="200,248 198,245 202,245" fill="#FDA4AF"/>
    <!-- Center Jewel Diadem -->
    <path d="M 192 220 L 196 210 L 200 216 L 204 210 L 208 220 Z" fill="url(#goldCamada)"/>
    <circle cx="200" cy="214" r="2" fill="#10B981"/>
  </g>

  <!-- KITTEN 4 (Right Center - Spotted Gray/Black Tabby Baby) -->
  <g id="baby-4">
    <ellipse cx="238" cy="275" rx="28" ry="22" fill="url(#kittenBlack)"/>
    <!-- Head -->
    <circle cx="248" cy="250" r="19" fill="url(#kittenBlack)"/>
    <!-- Ears -->
    <polygon points="238,236 242,225 248,235" fill="#334155"/>
    <polygon points="253,235 265,228 260,240" fill="#334155"/>
    <!-- Sleeping Eye -->
    <path d="M 247 253 Q 252 257 257 253" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="253,258 251,256 255,256" fill="#FDA4AF"/>
  </g>

  <!-- KITTEN 5 (Right - Sweet Golden-Orange Baby) -->
  <g id="baby-5">
    <ellipse cx="275" cy="270" rx="30" ry="24" fill="url(#kittenOrange)"/>
    <!-- Head -->
    <circle cx="290" cy="255" r="20" fill="url(#kittenOrange)"/>
    <!-- Ears -->
    <polygon points="277,243 280,230 288,240" fill="#EA580C"/>
    <polygon points="295,240 308,232 302,245" fill="#EA580C"/>
    <!-- Sleeping Eye -->
    <path d="M 290 258 Q 295 263 300 258" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
    <polygon points="296,264 294,262 298,262" fill="#FDA4AF"/>
    <!-- Tiny Crown on Baby 5 -->
    <path d="M 283 234 L 286 226 L 290 231 L 294 226 L 297 234 Z" fill="url(#goldCamada)"/>
  </g>

  <!-- Paws peeking over blanket -->
  <circle cx="130" cy="292" r="7" fill="#FFE2C7"/>
  <circle cx="190" cy="285" r="7" fill="#FEF08A"/>
  <circle cx="210" cy="285" r="7" fill="#FEF08A"/>
  <circle cx="270" cy="292" r="7" fill="#FFE2C7"/>

  <!-- Golden Scroll Ribbon at Bottom -->
  <g id="banner-ribbon">
    <path d="M 100 375 L 300 375 L 290 395 L 110 395 Z" fill="#0A0A0C" stroke="url(#goldCamada)" stroke-width="1.5"/>
    <text x="200" y="389" font-family="'Cinzel', serif, sans-serif" font-size="10" font-weight="bold" fill="url(#goldCamada)" text-anchor="middle" letter-spacing="2">LA CAMADA REAL ✦ 5 RECIÉN NACIDOS</text>
  </g>
</svg>
