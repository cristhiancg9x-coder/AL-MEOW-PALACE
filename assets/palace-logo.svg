<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#046307"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem Icon on Left -->
  <g transform="translate(6, 5)">
    <!-- Outer Gold Ring -->
    <circle cx="30" cy="30" r="28" fill="#121217" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="2 3"/>
    
    <!-- Royal Crown -->
    <path d="M 20 25 L 23 15 L 27 21 L 30 11 L 33 21 L 37 15 L 40 25 Z" fill="url(#gold)" filter="url(#goldGlow)"/>
    <circle cx="30" cy="11" r="1.8" fill="url(#emerald)"/>
    <circle cx="23" cy="15" r="1.3" fill="url(#emerald)"/>
    <circle cx="37" cy="15" r="1.3" fill="url(#emerald)"/>
    
    <!-- Stylized Cat Head -->
    <path d="M 23 27 C 23 22, 37 22, 37 27 C 40 33, 40 43, 30 45 C 20 43, 20 33, 23 27 Z" fill="#0A0A0C" stroke="url(#gold)" stroke-width="1.2"/>
    <!-- Cat Ears -->
    <polygon points="23,28 21,20 27,25" fill="url(#gold)"/>
    <polygon points="37,28 39,20 33,25" fill="url(#gold)"/>
    <!-- Cat Eyes -->
    <ellipse cx="26" cy="33" rx="1.5" ry="2.2" fill="url(#emerald)"/>
    <ellipse cx="34" cy="33" rx="1.5" ry="2.2" fill="url(#emerald)"/>
    <!-- Whiskers -->
    <path d="M 18 36 L 24 37 M 18 39 L 24 39 M 42 36 L 36 37 M 42 39 L 36 39" stroke="url(#gold)" stroke-width="0.8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 16)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="700" fill="url(#gold)" letter-spacing="3" filter="url(#goldGlow)">
      AL-MEOW
    </text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#E2D9C8" letter-spacing="4.5">
      PALACE &amp; RESCUE
    </text>
  </g>
</svg>