<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#0A0A0C" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <!-- Islamic crescent / Royal cat crown motif -->
  <path d="M 50 18 L 56 32 L 70 30 L 60 40 L 66 54 L 50 45 L 34 54 L 40 40 L 30 30 L 44 32 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Cat silhouette inside -->
  <path d="M 40 72 C 40 58, 44 55, 50 55 C 56 55, 60 58, 60 72 Z" fill="url(#goldGrad)"/>
  <!-- Cat ears -->
  <polygon points="42,56 46,47 48,56" fill="url(#goldGrad)"/>
  <polygon points="58,56 54,47 52,56" fill="url(#goldGrad)"/>
  <!-- Emerald jewel in center -->
  <circle cx="50" cy="36" r="3.5" fill="#046307" stroke="#F3E5AB" stroke-width="1"/>
  <!-- Whisker lines -->
  <path d="M 36 63 L 44 64 M 35 66 L 43 66 M 56 64 L 64 63 M 57 66 L 65 66" stroke="#0A0A0C" stroke-width="1" stroke-linecap="round"/>
</svg>