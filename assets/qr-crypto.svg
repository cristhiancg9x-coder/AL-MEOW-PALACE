<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cryptoQrBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1A14"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>
    <linearGradient id="goldQrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C5C0D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="14" fill="url(#cryptoQrBg)" stroke="url(#goldQrGrad)" stroke-width="2"/>

  <!-- QR Pattern Grid Simulation in Luxury Gold -->
  <g fill="url(#goldQrGrad)">
    <!-- Top-Left Finder Pattern -->
    <rect x="20" y="20" width="45" height="45" rx="6" fill="none" stroke="url(#goldQrGrad)" stroke-width="4"/>
    <rect x="30" y="30" width="25" height="25" rx="3"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="135" y="20" width="45" height="45" rx="6" fill="none" stroke="url(#goldQrGrad)" stroke-width="4"/>
    <rect x="145" y="30" width="25" height="25" rx="3"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="20" y="135" width="45" height="45" rx="6" fill="none" stroke="url(#goldQrGrad)" stroke-width="4"/>
    <rect x="30" y="145" width="25" height="25" rx="3"/>

    <!-- Data Blocks -->
    <rect x="75" y="22" width="10" height="10" rx="2"/>
    <rect x="92" y="22" width="12" height="6" rx="1"/>
    <rect x="110" y="22" width="8" height="10" rx="2"/>
    <rect x="75" y="40" width="8" height="12" rx="1"/>
    <rect x="90" y="36" width="14" height="14" rx="2"/>
    <rect x="112" y="38" width="10" height="8" rx="1"/>
    <rect x="75" y="58" width="14" height="8" rx="1"/>
    <rect x="96" y="56" width="8" height="12" rx="1"/>

    <!-- Alignment & Sync Lines -->
    <rect x="24" y="75" width="8" height="8" rx="1"/>
    <rect x="40" y="75" width="8" height="8" rx="1"/>
    <rect x="56" y="75" width="8" height="8" rx="1"/>
    <rect x="75" y="75" width="8" height="8" rx="1"/>
    <rect x="115" y="75" width="8" height="8" rx="1"/>
    <rect x="135" y="75" width="8" height="8" rx="1"/>
    <rect x="155" y="75" width="8" height="8" rx="1"/>

    <!-- Lower Data Blocks -->
    <rect x="75" y="92" width="12" height="12" rx="2"/>
    <rect x="94" y="92" width="8" height="16" rx="2"/>
    <rect x="110" y="90" width="14" height="10" rx="2"/>
    <rect x="135" y="92" width="10" height="12" rx="2"/>
    <rect x="155" y="92" width="12" height="8" rx="1"/>
    <rect x="172" y="92" width="8" height="12" rx="1"/>

    <rect x="75" y="115" width="14" height="8" rx="1"/>
    <rect x="96" y="112" width="12" height="12" rx="2"/>
    <rect x="115" y="115" width="8" height="14" rx="1"/>
    <rect x="135" y="112" width="16" height="8" rx="1"/>
    <rect x="160" y="112" width="12" height="14" rx="2"/>

    <rect x="75" y="135" width="10" height="14" rx="2"/>
    <rect x="92" y="138" width="14" height="8" rx="1"/>
    <rect x="112" y="135" width="10" height="12" rx="2"/>
    <rect x="130" y="135" width="12" height="12" rx="2"/>
    <rect x="150" y="135" width="16" height="10" rx="2"/>
    <rect x="172" y="135" width="8" height="14" rx="2"/>

    <rect x="75" y="156" width="12" height="10" rx="2"/>
    <rect x="94" y="154" width="8" height="14" rx="1"/>
    <rect x="110" y="156" width="14" height="8" rx="1"/>
    <rect x="132" y="154" width="10" height="14" rx="2"/>
    <rect x="150" y="156" width="12" height="10" rx="2"/>
    <rect x="168" y="154" width="12" height="12" rx="2"/>
  </g>

  <!-- Center Emblem (Crypto Diamond / Lightning Icon) -->
  <circle cx="100" cy="100" r="18" fill="#0A0A0C" stroke="url(#goldQrGrad)" stroke-width="2"/>
  <path d="M 100 88 L 108 97 L 102 97 L 105 112 L 93 102 L 99 102 Z" fill="url(#goldQrGrad)"/>
</svg>
