<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141C16"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E5E10"/>
    </linearGradient>
    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1ECE1"/>
      <stop offset="100%" stop-color="#D5CEBE"/>
    </linearGradient>
    <linearGradient id="rubi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bgGrad3)"/>
  
  <!-- Islamic Star Geometry -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#gold3)" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.4"/>
  <rect x="100" y="100" width="200" height="200" fill="none" stroke="url(#gold3)" stroke-width="0.8" opacity="0.25" transform="rotate(45 200 200)"/>
  <rect x="100" y="100" width="200" height="200" fill="none" stroke="url(#gold3)" stroke-width="0.8" opacity="0.25"/>

  <!-- Royal Robes: Emerald Green & Gold -->
  <path d="M 90 380 Q 200 310 310 380 L 310 400 L 90 400 Z" fill="#063813" stroke="url(#gold3)" stroke-width="2.5"/>
  <path d="M 150 340 L 200 400 L 250 340" fill="none" stroke="url(#gold3)" stroke-width="4"/>

  <!-- Fluffy Cat Body -->
  <path d="M 130 380 C 120 280, 150 250, 200 250 C 250 250, 280 280, 270 380 Z" fill="url(#whiteFur)"/>

  <!-- Fluffy Head -->
  <ellipse cx="200" cy="225" rx="76" ry="68" fill="url(#whiteFur)"/>
  <!-- Fluffy Cheeks -->
  <ellipse cx="140" cy="235" rx="25" ry="20" fill="url(#whiteFur)"/>
  <ellipse cx="260" cy="235" rx="25" ry="20" fill="url(#whiteFur)"/>

  <!-- Cat Ears -->
  <polygon points="135,180 155,120 185,165" fill="url(#whiteFur)"/>
  <polygon points="145,170 158,135 178,165" fill="#FFC8C8"/>
  <polygon points="265,180 245,120 215,165" fill="url(#whiteFur)"/>
  <polygon points="255,170 242,135 222,165" fill="#FFC8C8"/>

  <!-- Royal Arabian Keffiyeh / Headscarf on Mochi -->
  <path d="M 140 160 C 140 90, 260 90, 260 160 C 265 180, 200 185, 200 185 C 200 185, 135 180, 140 160 Z" fill="url(#rubi)" stroke="url(#gold3)" stroke-width="2"/>
  <!-- Golden Agal (Headband cord) -->
  <ellipse cx="200" cy="140" rx="55" ry="12" fill="none" stroke="url(#gold3)" stroke-width="5"/>
  <ellipse cx="200" cy="145" rx="54" ry="11" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Sapphire Blue Eyes -->
  <ellipse cx="170" cy="215" rx="14" ry="17" fill="#0284C7"/>
  <ellipse cx="230" cy="215" rx="14" ry="17" fill="#0284C7"/>
  <ellipse cx="170" cy="215" rx="4" ry="13" fill="#000000"/>
  <ellipse cx="230" cy="215" rx="4" ry="13" fill="#000000"/>
  <circle cx="167" cy="211" r="3.5" fill="#FFFFFF"/>
  <circle cx="227" cy="211" r="3.5" fill="#FFFFFF"/>

  <!-- Pink button nose & muzzle -->
  <polygon points="200,236 193,228 207,228" fill="#F472B6"/>
  <path d="M 193 238 Q 200 246 207 238" stroke="#D1879B" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <path d="M 160 238 L 90 235 M 160 244 L 85 248 M 160 250 L 95 260" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 240 238 L 310 235 M 240 244 L 315 248 M 240 250 L 305 260" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Name Plate -->
  <rect x="75" y="340" width="250" height="42" rx="21" fill="rgba(10, 10, 12, 0.85)" stroke="url(#gold3)" stroke-width="1.5"/>
  <text x="200" y="367" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="url(#gold3)" text-anchor="middle" letter-spacing="2">
    EMIR MOCHI
  </text>
</svg>