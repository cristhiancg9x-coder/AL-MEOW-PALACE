<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="yapePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8300E3"/>
      <stop offset="50%" stop-color="#6900B6"/>
      <stop offset="100%" stop-color="#4C0084"/>
    </linearGradient>
    <linearGradient id="yapeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B5"/>
      <stop offset="100%" stop-color="#00A892"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="25" y="20" width="450" height="580" rx="32" fill="url(#yapePurple)" stroke="url(#goldRim)" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Subtle geometric overlay -->
  <circle cx="430" cy="50" r="120" fill="url(#yapeCyan)" opacity="0.15"/>
  <circle cx="50" cy="550" r="100" fill="url(#yapeCyan)" opacity="0.1"/>

  <!-- Yape Brand Header -->
  <g transform="translate(250, 75)" text-anchor="middle">
    <!-- Yape stylized lettering -->
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      yape<tspan fill="#00D2B5">!</tspan>
    </text>
    <text y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#E9D5FF" letter-spacing="1">
      ESCANEIA Y SALVA A LOS GATITOS
    </text>
  </g>

  <!-- White QR Container Box -->
  <rect x="75" y="125" width="350" height="350" rx="24" fill="#FFFFFF" stroke="url(#goldRim)" stroke-width="2"/>

  <!-- Realistic QR Code Matrix Pattern -->
  <g transform="translate(105, 155)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#6900B6"/>
    <rect x="10" y="10" width="50" height="50" rx="6" fill="#FFFFFF"/>
    <rect x="20" y="20" width="30" height="30" rx="4" fill="#6900B6"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="220" y="0" width="70" height="70" rx="10" fill="#6900B6"/>
    <rect x="230" y="10" width="50" height="50" rx="6" fill="#FFFFFF"/>
    <rect x="240" y="20" width="30" height="30" rx="4" fill="#6900B6"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="220" width="70" height="70" rx="10" fill="#6900B6"/>
    <rect x="10" y="230" width="50" height="50" rx="6" fill="#FFFFFF"/>
    <rect x="20" y="240" width="30" height="30" rx="4" fill="#6900B6"/>

    <!-- Simulated QR Data Blocks -->
    <!-- Row segments -->
    <rect x="90" y="10" width="10" height="40" fill="#2D004F"/>
    <rect x="120" y="0" width="20" height="20" fill="#2D004F"/>
    <rect x="150" y="20" width="10" height="30" fill="#2D004F"/>
    <rect x="170" y="0" width="30" height="20" fill="#2D004F"/>
    <rect x="190" y="30" width="20" height="20" fill="#2D004F"/>

    <rect x="90" y="60" width="20" height="20" fill="#2D004F"/>
    <rect x="130" y="60" width="40" height="10" fill="#2D004F"/>
    <rect x="180" y="60" width="20" height="20" fill="#2D004F"/>

    <!-- Mid columns -->
    <rect x="10" y="90" width="30" height="20" fill="#2D004F"/>
    <rect x="50" y="90" width="20" height="40" fill="#2D004F"/>
    <rect x="80" y="90" width="20" height="10" fill="#2D004F"/>
    <rect x="230" y="90" width="20" height="30" fill="#2D004F"/>
    <rect x="260" y="90" width="30" height="20" fill="#2D004F"/>

    <rect x="0" y="130" width="40" height="20" fill="#2D004F"/>
    <rect x="60" y="140" width="20" height="20" fill="#2D004F"/>
    <rect x="220" y="130" width="40" height="10" fill="#2D004F"/>
    <rect x="270" y="130" width="20" height="40" fill="#2D004F"/>

    <rect x="20" y="170" width="20" height="30" fill="#2D004F"/>
    <rect x="50" y="170" width="30" height="10" fill="#2D004F"/>
    <rect x="220" y="160" width="20" height="30" fill="#2D004F"/>
    <rect x="250" y="180" width="40" height="10" fill="#2D004F"/>

    <!-- Bottom area data -->
    <rect x="90" y="220" width="30" height="20" fill="#2D004F"/>
    <rect x="130" y="230" width="20" height="40" fill="#2D004F"/>
    <rect x="160" y="220" width="30" height="20" fill="#2D004F"/>
    <rect x="210" y="220" width="20" height="30" fill="#2D004F"/>
    <rect x="240" y="240" width="40" height="20" fill="#2D004F"/>

    <rect x="90" y="260" width="30" height="20" fill="#2D004F"/>
    <rect x="160" y="250" width="30" height="30" fill="#2D004F"/>
    <rect x="200" y="260" width="30" height="20" fill="#2D004F"/>

    <!-- Central Logo Badge -->
    <circle cx="145" cy="145" r="32" fill="#FFFFFF" stroke="#8300E3" stroke-width="4"/>
    <circle cx="145" cy="145" r="26" fill="#8300E3"/>
    <!-- Cat crown icon in center of QR -->
    <path d="M 134 147 L 138 138 L 142 143 L 145 135 L 148 143 L 152 138 L 156 147 Z" fill="#00D2B5"/>
    <circle cx="145" cy="151" r="3" fill="#FFF"/>
  </g>

  <!-- Beneficiary / Contact Details -->
  <g transform="translate(250, 515)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">
      TITULAR: CARLOS A. CUEVAS
    </text>
    <text y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#00D2B5" letter-spacing="2">
      987 654 321
    </text>
    <text y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#D8B4FE">
      ¡Cualquier monto ayuda a alimentar a los 4 reyes!
    </text>
  </g>
</svg>